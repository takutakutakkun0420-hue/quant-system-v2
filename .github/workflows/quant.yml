name: Quant Execution Engine

# 👇 追加：前のプロセスが終わるまで次の起動をロック（二重発注の防止）
concurrency:
  group: quant-engine
  cancel-in-progress: false

on:
  schedule:
    # 毎日 月〜金の UTC時間14:00〜20:00 の間、30分ごとに実行
    - cron: '*/30 14-20 * * 1-5'
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy alpaca-py python-dotenv pyyaml matplotlib

      - name: Run Execution Engine
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python execution_engine.py

          global_settings:
  vix_kill_switch: 30.0
  max_portfolio_risk_pct: 0.10
  max_shares_per_trade: 1       # 👈 【最重要】被害最小化のため1株に固定
  max_concurrent_positions: 2
  system_stop_drawdown: -0.20
  default_atr_stop_multiplier: 2.0
  default_atr_trail_multiplier: 3.0

strategies:
  vcp_breakout_v1:
    enabled: true
    risk_pct_per_trade: 0.01
    volume_threshold: 0.8       # 👈 【テスト用】平均出来高の80%に緩和
    rsi_limit: 80
    vcp_compression_ratio: 0.9  # 👈 【テスト用】圧縮条件も緩和

  gap_up_v1:
    enabled: true
    risk_pct_per_trade: 0.01
    volume_threshold: 0.8       # 👈 【テスト用】緩和
    rsi_limit: 80
    gap_threshold_pct: 1.00     # 👈 【テスト用】前日終値以上ならOKに緩和
