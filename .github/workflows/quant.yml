name: Quant Execution Engine

# 👇 追加：前のプロセスが終わるまで次の起動をロック（二重発注の防止）
concurrency:
  group: quant-engine
  cancel-in-progress: false

on:
  schedule:
    # 毎日 月〜金の UTC時間14:00〜20:00 の間、30分ごとに実行
    - cron: '*/30 14-20 * * 1-5'
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy alpaca-py python-dotenv pyyaml matplotlib

      - name: Run Execution Engine
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python execution_engine.py
