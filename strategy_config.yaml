# ==========================================================
# 💎 The Quant Masterpiece - Final Production Config
# ==========================================================

global_settings:
  vix_kill_switch: 30.0
  max_portfolio_risk_pct: 0.10
  max_shares_per_trade: 1       # 最初の1週間は「1株」でデータ収集と挙動確認
  max_concurrent_positions: 2   # シグナルストーム回避：同時保有上限
  system_stop_drawdown: -0.20   # 資産の20%を失ったらシステム完全停止
  
  # 決済ロジックのポジション単位での統一
  default_atr_stop_multiplier: 2.0
  default_atr_trail_multiplier: 3.0

strategies:
  vcp_breakout_v1:
    enabled: true
    risk_pct_per_trade: 0.01
    volume_threshold: 1.5
    rsi_limit: 80
    vcp_compression_ratio: 0.7

  gap_up_v1:
    enabled: true
    risk_pct_per_trade: 0.01
    volume_threshold: 1.5
    rsi_limit: 80
    gap_threshold_pct: 1.01